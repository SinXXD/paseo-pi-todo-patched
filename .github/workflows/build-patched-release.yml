name: Build Patched Release

on:
  push:
    branches: [main]
    paths:
      - "packages/server/src/server/agent/providers/pi/**"
      - ".github/workflows/build-patched-release.yml"
  workflow_dispatch:
  schedule:
    # daily upstream sync at 02:00 UTC
    - cron: "0 2 * * *"

permissions:
  contents: write
  actions: read

jobs:
  sync-upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Sync from upstream getpaseo/paseo
        run: |
          git remote add upstream https://github.com/getpaseo/paseo.git || true
          git fetch upstream main --prune
          echo "Upstream HEAD: $(git rev-parse upstream/main)"
          echo "Local HEAD: $(git rev-parse HEAD)"
          if git merge-base --is-ancestor HEAD upstream/main; then
            echo "Already up-to-date or behind, attempting merge"
            if git merge --no-edit upstream/main; then
              git push origin main || echo "Push failed - may need manual resolution"
            else
              echo "Merge conflict - aborting sync, manual intervention needed"
              git merge --abort || true
              # Create an issue or PR for manual conflict resolution could be added here
              exit 0
            fi
          else
            echo "Local is ahead of upstream, skip sync"
          fi

  build-and-release:
    needs: sync-upstream
    if: always() && (needs.sync-upstream.result == 'success' || needs.sync-upstream.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - name: Install dependencies
        run: |
          for i in 1 2 3; do npm ci && break || { echo "npm ci failed (attempt $i), retrying..."; sleep 5; }; done
      - name: Generate validation AOT
        run: node packages/protocol/scripts/generate-validation-aot.mjs
      - name: Build patched server
        run: |
          npm run build --workspace=@getpaseo/protocol
          npm run build --workspace=@getpaseo/highlight
          npm run build --workspace=@getpaseo/relay
          npm run build --workspace=@getpaseo/client
          npm run build --workspace=@getpaseo/plugin
          npm run build --workspace=@getpaseo/server
          echo "Build done"
      - name: Verify patch is present
        run: |
          echo "=== agent.js ==="
          grep -c "mapTodoItemsFromToolResult" packages/server/dist/server/server/agent/providers/pi/agent.js
          grep -q 'type: "todo"' packages/server/dist/server/server/agent/providers/pi/agent.js && echo "todo event OK"
          echo "=== tool-call-mapper.js ==="
          grep -q "details.tasks" packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.js && echo "tasks compat OK"
          grep -q "details.todos" packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.js && echo "todos compat OK"
      - name: Upload patched artifacts
        uses: actions/upload-artifact@v4
        with:
          name: patched-server-pi-${{ github.run_number }}
          path: |
            packages/server/dist/server/server/agent/providers/pi/agent.js
            packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.js
            packages/server/dist/server/server/agent/providers/pi/agent.d.ts
            packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.d.ts
          retention-days: 30
      - name: Create Release (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/server/dist/server/server/agent/providers/pi/agent.js
            packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.js
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Auto Release on main push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TAG="patched-$(date +%Y%m%d)-${{ github.run_number }}"
          echo "Creating release $TAG"
          gh release create "$TAG" \
            --title "Patched build $TAG" \
            --notes "Auto-built from main at ${{ github.sha }}. Includes pi todo patch (details.tasks/todos compatible)." \
            packages/server/dist/server/server/agent/providers/pi/agent.js \
            packages/server/dist/server/server/agent/providers/pi/tool-call-mapper.js || echo "Release creation skipped or failed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}